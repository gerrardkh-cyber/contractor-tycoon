name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# The preview: a branch built with its own storage keys and a PREVIEW mark,
# served from /preview/ next to the game. Re-run this workflow on main after
# pushing that branch to refresh it.
env:
  PREVIEW_REF: order-009

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}
          path: preview-src
      - name: Preview - install
        working-directory: preview-src
        run: npm ci
      - name: Preview - test
        working-directory: preview-src
        run: npm test
      - name: Preview - build into dist/preview
        working-directory: preview-src
        env:
          VITE_PREVIEW: '1'
        run: |
          npm run build -- --outDir ../dist/preview --emptyOutDir
          echo "preview built from $(git rev-parse --short HEAD)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
